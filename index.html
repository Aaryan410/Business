<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1">
        <title>Business</title>
        <script src = "script.js" defer></script>
        <link rel = "stylesheet" href = "style.css">
        <link rel = "preconnect" href = "https://fonts.googleapis.com">
        <link rel = "preconnect" href = "https://fonts.gstatic.com" crossorigin>
        <link href = "https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel = "stylesheet">

    <body>
        <h1>Business</h1>
        <p>Money: $<span id = "balance">0.00</span></p>
        <p>Income: $<span id = "income-rate">0.00</span> / second</p>
        <button id = "earn-button" class = "earn-area">

        <p>Click multiplier: <span id = "multiplier">1</span></p>
        <button id = "multiplier-button" class = "upgrade-button">
            Upgrade to 2x - $5.00
        </button>
