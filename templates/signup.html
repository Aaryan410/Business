<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale = 1">
        <title>Create account · Business</title>

        <link href = "https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel = "stylesheet">
        <link rel = "stylesheet" href = "{{ url_for('static', filename = 'css/style.css') }}">
        <link rel = "stylesheet" href = "{{ url_for('static', filename = 'css/auth.css') }}">
    </head>

    <body>
        <main class = "auth-card">
            <h1>Create account</h1>

            {% for message in get_flashed_messages() %}
                <p class = "form-success" role = "alert">{{ message }}</p>
            {% endfor %}

            {% if error %}
                <p class = "form-error" role = "alert">{{ error }}</p>
            {% endif %}

            <form method = "post" action = "{{ url_for('signup') }}">
                <input type = "hidden" name = "csrf_token" value = "{{ csrf_token() }}">
                <label for = "username">Username</label>
                <input id = "username" name = "username" type = "text" value = "{{ username }}" autocomplete = "username" minlength = "3" maxlength = "30" pattern = "[A-Za-z0-9_]{3,30}" aria-describedby = "username-help" required>

                <p id = "username-help" class = "field-help">
                    Use 3-30 letters, numbers, or underscores.
                </p>

                <label for = "password">Password</label>
                <input id = "password" name = "password" type = "password" autocomplete = "new-password" minlength = "8" maxlength = "128" required>
                <button type = "submit" class = "upgrade-button">
                    Create account
                </button>
            </form>

            <p>
                Already have an account?
                <a href = "{{ url_for('login') }}" class = "back-link">
                    Log in
                </a>
            </p>
        </main>
    </body>
</html>
