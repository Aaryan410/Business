<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1">
        <title>Business</title>
        <script src = "{{ url_for('static', filename = 'js/script.js') }}" defer></script>
        <link rel = "stylesheet" href = "{{ url_for('static', filename = 'css/style.css') }}">
        <link rel = "preconnect" href = "https://fonts.googleapis.com">
        <link rel = "preconnect" href = "https://fonts.gstatic.com" crossorigin>
        <link href = "https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel = "stylesheet">
    </head>
    <body>
        <div class = "game-layout">

            <!-- left side bar for investment shi -->
            <aside class = "sidebar">
                <h2>Business</h2>

                <nav aria-label = "Game sections">
                    <a href = "{{ url_for('dashboard') }}" class = "nav-item active" aria-current = "page">
                        Dashboard
                    </a>

                    <button class = "nav-item" disabled>Companies</button>
                    <button class = "nav-item" disabled>Stocks</button>
                    <button class = "nav-item" disabled>Real Estate</button>
                    <button class = "nav-item" disabled>Startups</button>
                    <button class = "nav-item" disabled>Cars</button>
                </nav>

            </aside>

            <!-- middle area for clicking -->
            <main class = "dashboard">
                <h1>Dashboard</h1>

                <div class = "stats">
                    <p>Money: $<span id = "balance">0.00</span></p>

                    <p>
                        Passive income:
                        $<span id = "income-rate">0.00</span> / second
                    </p>
                </div>

                <button id = "earn-button" class = "earn-area">
                    Click anywhere to earn
                </button>
            </main>

            <!-- right bar for multiplier shi -->
            <aside class = "upgrades" aria-label = "Income upgrades">
                <h2>Upgrades</h2>

                <section class = "upgrade-card">
                    <h3>Click income</h3>

                    <p>
                        Multiplier:
                        <span id = "multiplier">1</span>×
                    </p>

                    <button id = "multiplier-button" class = "upgrade-button">
                        Upgrade to 2x - $5.00
                    </button>
                </section>

                <section class = "upgrade-card">
                    <h3>Passive income</h3>

                    <p>
                        Multiplier:
                        <span id = "income-multiplier">1</span>×
                    </p>

                    <button id = "income-multiplier-button" class = "upgrade-button">
                        Upgrade to 2x - $5.00
                    </button>
                </section>
            </aside>
            
        </div>
    </body>
</html>
