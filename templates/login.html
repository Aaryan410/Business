<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale = 1">
        <title>Log in · Business</title>

        <link href = "https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel = "stylesheet">
        <link rel = "stylesheet" href = "{{ url_for('static', filename = 'css/style.css') }}">
        <link rel = "stylesheet" href = "{{ url_for('static', filename = 'css/auth.css') }}">
    </head>

    <body>
        <main class = "auth-card">
            <h1>Log in</h1>

            {% for message in get_flashed_messages() %}
                <p class = "form-success" role = "status">{{ message }}</p>
            {% endfor %}

            {% if error %}
                <p class = "form-error" role = "alert">{{ error }}</p>
            {% endif %}

            <form method = "post" action = "{{ url_for('login') }}">
                <input type = "hidden" name = "csrf_token" value = "{{ csrf_token() }}">

                <label for = "username">Username</label>
                <input id = "username" name = "username" type = "text" value = "{{ username }}" autocomplete = "username" maxlength = "30" required>

                <label for = "password">Password</label>
                <input id = "password" name = "password" type = "password" autocomplete = "current-password" maxlength = "128" required>

                <button type = "submit" class = "upgrade-button">
                    Log in
                </button>
            </form>

            <p>
                Don't have an account?
                <a href = "{{ url_for('signup') }}" class = "back-link">
                    Create account
                </a>
            </p>
        </main>
    </body>
</html>
